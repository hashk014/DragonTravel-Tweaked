name: Reforged build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: DragonTravel-Reforged
          path: |
            target/DragonTravel-Reforged-2.0.0.jar
            target/DragonTravel-Reforged-2.0.0-sources.jar
