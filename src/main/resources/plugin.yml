name: DragonTravelReforged
main: fr.hash014.dragontravel.DragonTravelReforged
version: 2.0.0
description: Dragon journeys, scenic routes and crash recovery by hash014
authors: [hash014, Phiwa, Seyah]
website: https://github.com/hashk014/DragonTravel-Tweaked
softdepend: [Vault]
commands:
  dragontravel:
    aliases: [dt, dtr]
    description: DragonTravel Reforged
    usage: /dt help
permissions:
  dragontravel.use:
    default: true
  dragontravel.admin:
    default: op
  dragontravel.coords:
    default: op
  dragontravel.bypasscost:
    default: op
  dragontravel.destination.*:
    default: true
  dragontravel.route.*:
    default: true
  dragontravel.home:
    default: true
  dragontravel.player:
    default: true
